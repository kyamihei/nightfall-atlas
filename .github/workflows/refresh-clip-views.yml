# .github/workflows/refresh-clip-views.yml
#
# refresh-clip-views.ts を定期実行し、既存クリップのview_countを最新の値に近づけ続ける
# ワークフロー。sync-clips.yml（日次、新規クリップの発見・収集が主目的）とは別に、
# 「作成から24時間を超えた既存クリップのview_countが実際の値からズレていく」問題に対応する。
#
# 【重要】GitHub Actions自体の`schedule`トリガーは実測で信頼できないことが判明したため
# （毎時のはずが実際は数時間おきにしか発火せず、view_countが全クリップの95%で
# 一度も更新されないという実害が発生）、scheduleトリガーはあえて設定していない。
# 代わりにSupabase側のpg_cron（DBレベルのスケジューラ）が毎時20分にこのworkflowの
# dispatches APIをWebhookで叩く方式にした
# （`supabase/migrations/20260903140000_reliable_cron_via_pg_cron.sql`の
# `trigger-refresh-clip-views`ジョブ）。workflow_dispatchはpg_cronからの起動と手動実行を兼ねる。
#
# 事前準備: sync-clips.ymlと同じSecretsを使う（追加設定は不要）
#   TWITCH_CLIENT_ID / TWITCH_CLIENT_SECRET / SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
#
# 【2026-09-05】既定値を5000→20000に引き上げた。導入直後（view_count_synced_at列を追加した
# 時点）の全クリップは一律nullのため「一度も同期されていないクリップ」の初期バックログが
# 数十万件規模になり、5000件/時ではこれを消化しきるまでに数日かかっていた（実際にユーザーから
# 「視聴回数が実際よりかなり少ない」と報告のあったクリップも、このバックログの順番待ち中だった）。
# 1回20000件でも実測2〜4倍（約6〜14分程度）で収まりhttp呼び出し回数もTwitch側のレート制限に
# 対して余裕があるため、この値まで引き上げてバックログの解消を早めている。

name: Refresh Clip View Counts

on:
  workflow_dispatch:
    inputs:
      max_clips:
        description: "1回の実行で同期する最大クリップ数"
        required: false
        default: "20000"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Denoをセットアップ
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: view_count同期スクリプトを実行
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VIEW_SYNC_MAX_CLIPS: ${{ github.event.inputs.max_clips || '20000' }}
        run: deno run --allow-net --allow-env refresh-clip-views.ts
