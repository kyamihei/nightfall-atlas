# .github/workflows/sync-clips.yml
#
# sync-twitch-clips.ts を毎日自動実行するためのGitHub Actionsワークフロー。
# tw-clipの集計期間が「毎朝6時始まり」だったのに合わせて、JST 6:05頃に実行する設定。
#
# 【重要】GitHub Actions自体の`schedule`トリガーは実測で信頼できないことが判明したため
# （本来UTC 21:05発火のはずが実際は23時台にずれ込む等）、scheduleトリガーはあえて
# 設定していない。代わりにSupabase側のpg_cron（DBレベルのスケジューラ）がUTC 21:05に
# このworkflowのdispatches APIをWebhookで叩く方式にした
# （`supabase/migrations/20260903140000_reliable_cron_via_pg_cron.sql`の
# `trigger-sync-clips`ジョブ）。workflow_dispatchはpg_cronからの起動と手動実行を兼ねる。
#
# 事前準備:
#   このリポジトリの Settings > Secrets and variables > Actions で
#   以下のSecretsを登録しておくこと。
#     TWITCH_CLIENT_ID
#     TWITCH_CLIENT_SECRET
#     SUPABASE_URL
#     SUPABASE_SERVICE_ROLE_KEY
#     TARGET_GAME_IDS   例: 263490,516575

name: Sync Twitch Clips

on:
  workflow_dispatch: {} # pg_cronからのAPI起動、およびActionsタブからの手動実行用

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Denoをセットアップ
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 同期スクリプトを実行
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TARGET_GAME_IDS: ${{ secrets.TARGET_GAME_IDS }}
        run: deno run --allow-net --allow-env sync-twitch-clips.ts
