# .github/workflows/sync-live-clips.yml
#
# sync-live-clips.ts をいまライブ配信中の追跡配信者だけ高頻度でチェックし、
# 新しいクリップをすばやくサイトへ反映するためのワークフロー。
# 2026-09-03、「最新クリップの反映が遅い」という要望への対応で追加。
#
# 【重要】GitHub Actions自体の`schedule`トリガーは実測で信頼できないことが判明したため
# （15分おき設定のはずが実際は数時間おきにしか発火せず、クリップ取りこぼしの実害が発生）、
# scheduleトリガーはあえて設定していない。代わりにSupabase側のpg_cron（DBレベルの
# スケジューラ）が15分おきにこのworkflowのdispatches APIをWebhookで叩く方式にした
# （`supabase/migrations/20260903140000_reliable_cron_via_pg_cron.sql`の
# `trigger-sync-live-clips`ジョブ）。workflow_dispatchはpg_cronからの起動と手動実行を兼ねる。
#
# 事前準備:
#   sync-clips.ymlと同じSecretsを使うため追加設定は不要（TARGET_GAME_IDSは使わない）。
#     TWITCH_CLIENT_ID
#     TWITCH_CLIENT_SECRET
#     SUPABASE_URL
#     SUPABASE_SERVICE_ROLE_KEY

name: Sync Live Twitch Clips

on:
  workflow_dispatch: {} # pg_cronからのAPI起動、およびActionsタブからの手動実行用

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Denoをセットアップ
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: ライブクリップ同期スクリプトを実行
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: deno run --allow-net --allow-env sync-live-clips.ts
